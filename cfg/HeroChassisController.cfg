#!/usr/bin/env python
PACKAGE = "hero_chassis_controller"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

for wheel in ["lf", "rf", "lb", "rb"]:
    gen.add(wheel + "_p", double_t, 0, "proportional gain", 1.0, 0.0, 20.0)
    gen.add(wheel + "_i", double_t, 0, "integral gain", 0.1, 0.0, 20.0)
    gen.add(wheel + "_d", double_t, 0, "derivative gain", 0.0, 0.0, 20.0)
    gen.add(wheel + "_i_clamp_max", double_t, 0, "integral term upper limit", 0.3, 0.0, 5.0)
    gen.add(wheel + "_i_clamp_min", double_t, 0, "integral term lower limit", -0.3, -5.0, 0.0)

exit(gen.generate(PACKAGE, "hero_chassis_controller", "HeroChassisController"))